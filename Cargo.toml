[package]
name = "herdr-reviewr"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A terminal review pane for herdr: browse an agent's changes and send comments back to chat."
authors = ["Dmitry Persiyanov <dmitry.persiyanov@gmail.com>"]
license = "MIT"
repository = "https://github.com/pi-dal/herdr-preview"
homepage = "https://github.com/pi-dal/herdr-preview"
readme = "README.md"
keywords = ["herdr", "tui", "diff", "review", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "herdr-preview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
# Bounded, in-process raster decode for the read-only halfblock image preview.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fff-search = "0.10.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30"
# Descriptor-relative `openat`/`O_NOFOLLOW` Files-only capability boundary.
rustix = { version = "=1.1.4", features = ["fs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.1.1", features = ["text"] }
# Dumps + fancy-regex only: no yaml-load (we read prebuilt binary syntax dumps, so the
# unmaintained yaml-rust never enters the tree), no onig (pure-Rust regex engine).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "plist-load"] }
toml = "1.1"
two-face = "0.5.1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic allows for an application binary (vs a public library):
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"

[profile.release]
strip = true
lto = "thin"
